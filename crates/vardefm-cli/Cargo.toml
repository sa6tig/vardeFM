[package]
name = "vardefm-cli"
description = "Test and measurement tool for VardeFM"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vardefm"
path = "src/main.rs"

[dependencies]
clap.workspace = true
hound.workspace = true
num-complex.workspace = true
vardefm-dsp.workspace = true
vardefm-sim.workspace = true
vardefm-tnc.workspace = true
vardefm-modem.workspace = true
vardefm-link.workspace = true
vardefm-audio.workspace = true
vardefm-ptt.workspace = true
ctrlc = "3.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
base64 = "0.23.1"
vardefm-api.workspace = true
tungstenite.workspace = true
serde_json.workspace = true

[lib]
name = "vardefm_cli"
path = "src/lib.rs"
